<script>
const images = [
    "IMAGES/image1.jpg",
    "IMAGES/image2.jpg",
    "IMAGES/image3.gif",
    "IMAGES/image4.jpg",
    "IMAGES/image5.jpg",
    "IMAGES/image6.jpg",
    "IMAGES/image7.jpg",
    "IMAGES/image8.jpg",
    "IMAGES/image9.png",
    "IMAGES/image10.png"
];
let index = 0;
const img1 = document.getElementById("img1");
const img2 = document.getElementById("img2");
function changeImages(){
    // Fade out
    img1.classList.add("fade-out");
    img2.classList.add("fade-out");
    setTimeout(() => {
        // Change images
        img1.src = images[index];
        img2.src = images[(index + 1) % images.length];
        // Fade in
        img1.classList.remove("fade-out");
        img2.classList.remove("fade-out");
        // Move by 2 images
        index = (index + 2) % images.length;
    }, 1500);
}
// Change every 5 seconds
setInterval(changeImages, 5000);
</script>
